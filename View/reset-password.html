<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - TrackBack</title>
  <link rel="icon" href="img/logo/favicon-circle.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/index.css" />
</head>
<body>

<div id="header-placeholder"></div>
<script>
  fetch("header.html").then(r=>r.text()).then(d=>document.getElementById("header-placeholder").innerHTML=d);
</script>

<main>
  <section class="auth">
    <div class="container auth__grid">

      <div class="auth__info">
        <h1 class="auth__title">Verify OTP & set a <span class="accent">new password</span></h1>
        <p class="auth__subtitle">Enter the OTP from email and your new password.</p>
        <div class="auth__badge">⏳ OTP expires in 10 minutes</div>
      </div>

      <div class="auth__card">
        <h2 class="auth-card__title">Reset Password</h2>
        <p class="auth-card__subtitle">Secure update with OTP verification</p>

        <div id="msg" style="display:none;margin-bottom:20px;padding:12px;border-radius:8px;"></div>

        <form class="auth-form" id="rpForm">
          <div class="form-field">
            <label>Email</label>
            <input type="email" id="rpEmail" readonly>
          </div>

          <div class="form-field">
            <label>OTP Code</label>
            <input type="text" id="rpOtp" placeholder="Enter 6-digit OTP" maxlength="6" required>
          </div>

          <div class="auth-form__row">
            <div class="form-field">
              <label>New Password</label>
              <div class="password-input-wrapper">
                <input type="password" id="rpNew" placeholder="New password" required>
                <button type="button" class="password-toggle" id="t1"><i class="fas fa-eye"></i></button>
              </div>
            </div>

            <div class="form-field">
              <label>Confirm Password</label>
              <div class="password-input-wrapper">
                <input type="password" id="rpConfirm" placeholder="Confirm password" required>
                <button type="button" class="password-toggle" id="t2"><i class="fas fa-eye"></i></button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn--green btn--pill auth-form__btn" id="resetBtn">
            Update Password
          </button>

          <p class="auth-form__footer">
            Back to <a href="login.html" class="form-link">Login</a>
          </p>
        </form>
      </div>

    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script>
  fetch("footer.html").then(r=>r.text()).then(d=>document.getElementById("footer-placeholder").innerHTML=d);
</script>

<script>
  const email = sessionStorage.getItem('fp_email') || '';
  document.getElementById('rpEmail').value = email;

  const msg = document.getElementById('msg');
  const show = (t, ok=false)=>{
    msg.style.display='block';
    msg.style.backgroundColor = ok ? '#d4edda' : '#f8d7da';
    msg.style.border = ok ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
    msg.style.color = ok ? '#155724' : '#721c24';
    msg.innerHTML = t;
  };

  function toggle(inp, btn){
    const icon = btn.querySelector('i');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
  }

  document.getElementById('t1').onclick = ()=>toggle(document.getElementById('rpNew'), document.getElementById('t1'));
  document.getElementById('t2').onclick = ()=>toggle(document.getElementById('rpConfirm'), document.getElementById('t2'));

  document.getElementById('rpForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('resetBtn');
    const old = btn.innerHTML;

    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Updating...';

    try{
      const fd = new FormData();
      fd.append('action','forgot_verify');
      fd.append('email', document.getElementById('rpEmail').value);
      fd.append('otp', document.getElementById('rpOtp').value.trim());
      fd.append('new_password', document.getElementById('rpNew').value);
      fd.append('confirm_password', document.getElementById('rpConfirm').value);

      const res = await fetch('../Controller/auth_api.php', {method:'POST', credentials:'include', body:fd});
      const data = await res.json();

      if(data.success){
        show('<i class="fas fa-check-circle"></i> '+data.message, true);
        sessionStorage.removeItem('fp_email');
        setTimeout(()=> window.location.href='login.html', 900);
      } else {
        show('<i class="fas fa-exclamation-circle"></i> '+data.message, false);
      }
    } catch(err){
      show('<i class="fas fa-exclamation-circle"></i> Error updating password.', false);
    }

    btn.disabled=false; btn.innerHTML=old;
  });
</script>

</body>
</html>
