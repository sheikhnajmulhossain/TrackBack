<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - TrackBack</title>
  <link rel="icon" href="img/logo/favicon-circle.png" type="image/png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./index.css" />
</head>
<body>

<div id="header-placeholder"></div>
<script>
  fetch("header.html").then(r=>r.text()).then(d=>document.getElementById("header-placeholder").innerHTML=d);
</script>

<main>
  <section class="auth">
    <div class="container auth__grid">

      <div class="auth__info">
        <h1 class="auth__title">Reset your <span class="accent">TrackBack</span> password</h1>
        <p class="auth__subtitle">Enter your email and we’ll send an OTP code.</p>
        <ul class="auth__list">
          <li>Fast email OTP verification</li>
          <li>Secure password update</li>
          <li>Back to login after success</li>
        </ul>
        <div class="auth__badge">🔐 Secure password recovery</div>
      </div>

      <div class="auth__card">
        <h2 class="auth-card__title">Forgot Password</h2>
        <p class="auth-card__subtitle">We’ll send a 6-digit OTP to your email</p>

        <div id="msg" style="display:none;margin-bottom:20px;padding:12px;border-radius:8px;"></div>

        <form class="auth-form" id="fpForm">
          <div class="form-field">
            <label>Email</label>
            <input type="email" id="fpEmail" placeholder="student@university.edu" required>
          </div>

          <button type="submit" class="btn btn--green btn--pill auth-form__btn" id="sendBtn">
            Send OTP
          </button>

          <p class="auth-form__footer">
            Remembered password? <a href="login.html" class="form-link">Login</a>
          </p>
        </form>
      </div>

    </div>
  </section>
</main>

<div id="footer-placeholder"></div>
<script>
  fetch("footer.html").then(r=>r.text()).then(d=>document.getElementById("footer-placeholder").innerHTML=d);
</script>

<script>
  const msg = document.getElementById('msg');
  const show = (t, ok=false)=>{
    msg.style.display='block';
    msg.style.backgroundColor = ok ? '#d4edda' : '#f8d7da';
    msg.style.border = ok ? '1px solid #c3e6cb' : '1px solid #f5c6cb';
    msg.style.color = ok ? '#155724' : '#721c24';
    msg.innerHTML = t;
  };

  document.getElementById('fpForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('fpEmail').value.trim();
    const btn = document.getElementById('sendBtn');
    const old = btn.innerHTML;

    btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Sending...';

    try{
      const fd = new FormData();
      fd.append('action','forgot_start');
      fd.append('email', email);

      const res = await fetch('../Controller/auth_api.php', {method:'POST', credentials:'include', body:fd});
      const data = await res.json();

      if(data.success){
        show('<i class="fas fa-check-circle"></i> '+data.message, true);
        sessionStorage.setItem('fp_email', email);
        setTimeout(()=> window.location.href='reset-password.html', 700);
      } else {
        show('<i class="fas fa-exclamation-circle"></i> '+data.message, false);
      }
    } catch(err){
      show('<i class="fas fa-exclamation-circle"></i> Error sending OTP.', false);
    }

    btn.disabled=false; btn.innerHTML=old;
  });
</script>

</body>
</html>
